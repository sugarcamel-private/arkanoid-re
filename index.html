    display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;

    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}

    background:#000;box-shadow:0 0 0 1px #222,0 0 50px rgba(80,110,255,.12);}
  #stage.wide{height:auto;width:100%;max-width:100%;aspect-ratio:1.30/1;}
  #stage.wide #scan{display:none;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply;opacity:.6;}
  @media (prefers-reduced-motion:reduce){#scan{opacity:.3}}

/* ==========================================================

  if(m==='2002'){
    W=256;H=224;WALL=16;FX=16;FW=160;FR=176;COLS=10;BW=16;BH=8;
    TOP=16;ROOF=16;PADY=196;PADH=8;PW_N=32;BR=2;SIDEHUD=true;SC=0.39;
    stage.classList.add('wide');
  }else{
    W=384;H=576;WALL=16;FX=16;FW=352;FR=368;COLS=11;BW=32;BH=16;
    TOP=112;ROOF=72;PADY=516;PADH=14;PW_N=64;BR=4.5;SIDEHUD=false;SC=1;
    stage.classList.remove('wide');
  }
  cv.width=W;cv.height=H;fitDPR();
}
function fitDPR(){
  const d=Math.min(window.devicePixelRatio||1,3);
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;
}
function CX(){return FX+FW/2;}
window.addEventListener('resize',fitDPR);

const BOSS2002={11:'crawler',22:'doh',33:'dohfinal'};
function idx2002(r){return r<11?r-1:(r<22?r-2:r-3);}

/* 仕様書で判明しているアイテム出現順（ROUND 1・2）。以降は既定リストを回す */
const CAPSEQ={1:['T','E','L','R','E','T'],2:['C','L','S','C','M','L']};
const CAPSEQ_DEFAULT=['E','L','C','D','M','T','E','B','L','P','S','M'];

/* ===================== 音 ===================== */
let actx=null;
function unlockAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
function beep(f,d,t,v){if(!actx)return;try{
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.05;
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* ===================== 保存 ===================== */
let mode='1986';
const hi={'1986':0,'2002':0};
try{
  hi['1986']=parseInt(localStorage.getItem('vaus.hi.1986')||'0',10)||0;
  hi['2002']=Math.max(50000,parseInt(localStorage.getItem('vaus.hi.2002')||'0',10)||0);
  const m=localStorage.getItem('vaus.mode');if(m==='1986'||m==='2002')mode=m;
}catch(e){}
function saveHi(){try{localStorage.setItem('vaus.hi.'+mode,String(hi[mode]));}catch(e){}}
function saveMode(){try{localStorage.setItem('vaus.mode',mode);}catch(e){}}

/* ===================== 状態 ===================== */
const FINAL=33;
let state='title';
let score=0,lives=3,round=1,nextExt=20000;
let bricks=[],balls=[],caps=[],shots=[],bits=[],foes=[],darts=[],pets=[];
let paddle={x:0,w:64,wTarget:64,wFrom:64,animT:0,target:0,laser:0,catchOn:0,holdT:0,mega:0,scoreMul:1,expandLv:0};
let doorOpen=false,doorAnim=0,reverseT=0,shield=0;
let hitCount=0,speedStep=0,ceilHit=false,slowF=1,stallT=0;
let capCount=0,capTarget=0,capIdx=0,lastCap='',capStreak=0,volley=0;
let boss=null,absorbed=0;
let msg='',readyT=0,clearT=0,contT=0,shake=0,flash=0,fireCool=0,foeTimer=0;
let fadeIn=0,serveSpawn=0;
let titleSel=1;

/* ===================== 速度 ===================== */
const FAST=[8,10,14,16,23,27,29],SLOW=[11,13,17,28];
const STEPS=[10,22,38,58,82];
function baseSpeed(){
  if(mode==='2002') return TUNE.ballSpeedPxPerSec/60;
  let s=2.9+Math.min(Math.floor((round-1)/8),3)*0.16;
  if(FAST.indexOf(round)>=0)s+=0.45;
  if(SLOW.indexOf(round)>=0)s-=0.40;
  return s;
}
function ballSpeed(){
  if(mode==='2002') return baseSpeed()*slowF; // 原作は極端に高速化しない
  return baseSpeed()*(1+0.13*speedStep)*slowF;
}
function renorm(){const t=ballSpeed();
  for(const b of balls){if(b.stuck)continue;const s=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/s*t;b.vy=b.vy/s*t;}}
function recalcStep(){
  if(mode==='2002')return;
  let s=0;
  for(let i=0;i<STEPS.length;i++) if(hitCount>=STEPS[i])s++;
  if(ceilHit)s++;
  s=Math.min(s+Math.floor(stallT/2400),5);
  if(s!==speedStep){speedStep=s;renorm();}
}
function countHit(){hitCount++;slowF=Math.min(1,slowF+0.006);recalcStep();renorm();}

/* ===================== 得点 ===================== */
function addScore(n){
  score+=n*paddle.scoreMul;
  while(score>=nextExt){lives=Math.min(lives+1,9);
    nextExt=(nextExt===20000)?60000:nextExt+60000;beep(1200,.12,'triangle',.06);}
  if(score>hi[mode]){hi[mode]=score;saveHi();}
}

/* ===================== ラウンド ===================== */
function silverHP(){return 2+Math.floor((round-1)/8);}
function buildRound(){
  bricks=[];caps=[];shots=[];bits=[];foes=[];darts=[];pets=[];boss=null;absorbed=0;
  doorOpen=false;doorAnim=0;reverseT=0;shield=0;
  hitCount=0;speedStep=0;ceilHit=false;slowF=1;stallT=0;
  capCount=0;capTarget=3+((Math.random()*5)|0);capIdx=0;lastCap='';capStreak=0;
  foeTimer=Math.round(420*(mode==='2002'?1:1));
  const bk=(mode==='2002')?BOSS2002[round]:(round===FINAL?'doh86':null);
  if(bk){makeBoss(bk);return;}
  const map=(mode==='2002')?L2002[idx2002(round)]:L1986[(round-1)%L1986.length];
  for(let r=0;r<map.length;r++) for(let c=0;c<COLS;c++){
    let ch=map[r][c];
    if(!ch||ch==='.')continue;
    let item=false;
    const li=ITEMCH.indexOf(ch);
    if(li>=0){ch=COLKEYS[li];item=true;}
    const hp = ch==='G'?Infinity : (ch==='S'?2 : (ch==='V'?3 : 1));
    bricks.push({x:FX+c*BW,y:TOP+r*BH,t:ch,alive:true,hit:0,hp:hp,item:item});
  }
}
function makeBoss(kind){
  const cx=CX();
  if(kind==='doh86'){
    boss={kind:'doh86',x:cx,y:ROOF+92,w:112,h:104,hp:16,flash:0,dart:240};
    for(let c=0;c<COLS;c++) if('GG.......GG'[c]==='G')
      bricks.push({x:FX+c*BW,y:TOP+188,t:'G',alive:true,hit:0,hp:Infinity,item:false});
  }else if(kind==='crawler'){
    boss={kind:'crawler',t:0,trail:[],seg:[],dart:150,flash:0,amp:FW*0.36,cy:ROOF+30,lead:6};
    for(let i=0;i<8;i++)boss.seg.push({alive:true});
  }else if(kind==='doh'){
    boss={kind:'doh',x:cx,y:ROOF+40,w:66,h:56,hp:16,flash:0,timer:220,flip:false,laser:280,minions:[]};
  }else if(kind==='dohfinal'){
    boss={kind:'dohfinal',x:cx,y:ROOF+34,w:52,h:44,hp:12,flash:0,t:0,
      arms:[{side:-1,hp:5,y:0,st:0,flash:0},{side:1,hp:5,y:0,st:0,flash:0}],
      punch:220,laser:190,rev:560};
  }
}
function setWidth(w,animate){
  const c=paddle.x+paddle.w/2;
  if(animate&&mode==='2002'){paddle.wFrom=paddle.w;paddle.wTarget=w;paddle.animT=TUNE.expandTicks;}
  else{paddle.w=w;paddle.wTarget=w;paddle.animT=0;}
  paddle.x=c-(paddle.animT?paddle.w:w)/2;
}
function clearEffects(){
  paddle.expandLv=0;setWidth(PW_N,false);
  paddle.laser=0;paddle.catchOn=0;paddle.holdT=0;paddle.mega=0;paddle.scoreMul=1;
  // S・B・Pは他のアイテムでは解除されない
}
function newBall(){
  const bx=paddle.x+paddle.w/2;
  balls=[{x:bx,y:PADY-BR-1,vx:0,vy:0,r:BR,stuck:true,off:0}];
}
function startRound(){
  buildRound();clearEffects();
  paddle.x=CX()-paddle.w/2;
  paddle.target=paddle.x+paddle.w/2;
  newBall();
  if(mode==='2002'){state='ready';msg='';readyT=TUNE.readyTicks;fadeIn=24;serveSpawn=0;}
  else{state='ready';msg='ROUND '+round;readyT=300;}
}
function startGame(){score=0;lives=3;round=1;nextExt=20000;startRound();}
function loseLife(){
  lives--;beep(150,.45,'sawtooth',.08);shake=14;
  if(lives<=0){
    if(score>hi[mode]){hi[mode]=score;saveHi();}
    if(mode==='2002'){state='continue';msg='CONTINUE?';contT=600;}
    else{state='over';msg='GAME OVER';}
    return;
  }
  caps=[];shots=[];darts=[];pets=[];absorbed=0;shield=0;
  clearEffects();doorOpen=false;slowF=1;recalcStep();
  if(boss&&boss.kind==='doh86')boss.hp=16;
  paddle.x=CX()-paddle.w/2;paddle.target=paddle.x+paddle.w/2;newBall();
  if(mode==='2002'){state='ready';msg='';readyT=120;serveSpawn=0;}
  else{state='ready';msg='READY';readyT=180;}
}
function clearRound(bonus){
  if(bonus)addScore(bonus);
  state='clear';clearT=(mode==='2002'?TUNE.roundClearTicks:110);
  msg=(mode==='2002')?'':(bonus?'BREAK OUT!':'ROUND CLEAR');
  beep(880,.1,'triangle',.06);
}
function finishGame(){state='win';msg='CONGRATULATIONS';if(score>hi[mode]){hi[mode]=score;saveHi();}}

/* ===================== 入力 ===================== */
function cX(v){const r=cv.getBoundingClientRect();return (v-r.left)/r.width*W;}
function cY(v){const r=cv.getBoundingClientRect();return (v-r.top)/r.height*H;}
function inGrab(x,y){return y>=PADY-(mode==='2002'?34:70)&&x>=paddle.x-(mode==='2002'?14:30)&&x<=paddle.x+paddle.w+(mode==='2002'?14:30);}
function setTarget(x){paddle.target=(reverseT>0)?(FX+FR-x):x;}
function press(){
  unlockAudio();
  if(state==='title'){mode=(titleSel===0)?'1986':'2002';saveMode();setLayout(mode);startGame();return;}
  if(state==='over'||state==='win'){state='title';setLayout('1986');return;}
  if(state==='continue'){lives=3;caps=[];shots=[];darts=[];pets=[];absorbed=0;shield=0;
    clearEffects();doorOpen=false;slowF=1;recalcStep();newBall();
    state='ready';msg='ROUND '+round;readyT=180;return;}
  if(state==='ready')return;
  if(state==='serve'){launch();return;}
  if(state==='play'){
    let did=false;
    for(const b of balls) if(b.stuck){releaseBall(b);did=true;}
    if(did)return;
    if(paddle.laser>0&&fireCool<=0){
      volley++;
      const sp=(mode==='2002')?TUNE.laserPairSpacing:paddle.w-12, cx=paddle.x+paddle.w/2;
      shots.push({x:cx-sp/2,y:PADY,link:volley,dead:false},{x:cx+sp/2,y:PADY,link:volley,dead:false});
      fireCool=(mode==='2002')?TUNE.laserCooldownTicks:13;
      beep(980,.05,'square',.04);
    }
  }
}
function launch(){state='play';msg='';const b=balls[0];if(b&&b.stuck)releaseBall(b);}
function releaseBall(b){
  b.stuck=false;paddle.holdT=0;
  const s=ballSpeed(),a=0.62;
  b.vx=Math.sin(a)*s*(b.off<0?-1:1);b.vy=-Math.cos(a)*s;
  beep(700,.06,'square',.05);
}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();unlockAudio();
  const x=cX(e.clientX),y=cY(e.clientY);
  if(state==='title'){titleSel=(y<318)?0:1;press();return;}
  if(e.pointerType==='mouse'){setTarget(x);press();return;}
  if(state==='over'||state==='win'||state==='continue'){press();return;}
  if(inGrab(x,y)){drag={id:e.pointerId,off:x-(paddle.x+paddle.w/2),x0:x,moved:0};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}}
  else press();
},{passive:false});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();const x=cX(e.clientX);
  if(drag&&e.pointerId===drag.id){drag.moved=Math.max(drag.moved,Math.abs(x-drag.x0));setTarget(x-drag.off);}
  else if(e.pointerType==='mouse'&&e.buttons)setTarget(x);
},{passive:false});
cv.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id){if(drag.moved<8)press();drag=null;}});
cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)drag=null;});
cv.addEventListener('mousemove',e=>{setTarget(cX(e.clientX));});
const keys={};
window.addEventListener('keydown',e=>{

/* ===================== アイテム ===================== */
const CAP={'L':{c:'#d82800'},'E':{c:'#0070ec'},'C':{c:'#80d010'},'S':{c:'#fc9838'},
 'B':{c:'#b040e0'},'D':{c:'#3cbcfc'},'P':{c:'#bcbcbc'},'M':{c:'#a050ff'},
 'R':{c:'#404048'},'T':{c:'#00c0a0'}};
const POOL86=['L','E','E','C','S','B','D','D','P'];
function maxCaps(){return mode==='2002'?TUNE.maxCapsulesOnScreen:1;}
function nextCapType(){
  if(mode!=='2002')return POOL86[(Math.random()*POOL86.length)|0];
  const seq=CAPSEQ[round]||CAPSEQ_DEFAULT;
  const t=seq[capIdx%seq.length];capIdx++;return t;
}
function tryDropCap(x,y,fromItemBlock){
  if(caps.length>=maxCaps())return;
  if(boss)return;
  if(mode==='2002'){
    if(!fromItemBlock)return;                      // 原作はアイテム入りブロックが固定
  }else{
    if(balls.length>1)return;
    capCount++;
    if(capCount<capTarget)return;
    capCount=0;capTarget=3+((Math.random()*5)|0);
  }
  caps.push({x:x,y:y,t:nextCapType(),ph:0});
}
function applyCap(t){
  if(t===lastCap){capStreak=Math.min(capStreak+1,4);}else{capStreak=0;lastCap=t;}
  addScore(1000*(mode==='2002'?(capStreak+1):1));
  if(t!=='S'&&t!=='B'&&t!=='P'&&t!=='T')clearEffects();
  beep(900,.1,'triangle',.06);
  if(t==='E'){
    if(mode==='2002'){paddle.expandLv=Math.min(2,paddle.expandLv+1);
      setWidth([32,48,64][paddle.expandLv],true);}
    else setWidth(96,false);
  }
  else if(t==='R'){setWidth(mode==='2002'?24:40,false);paddle.scoreMul=2;}
  else if(t==='C')paddle.catchOn=1;
  else if(t==='L')paddle.laser=1;
  else if(t==='M')paddle.mega=1;
  else if(t==='T')shield=1;
  else if(t==='S'){
    if(mode==='2002'){paddle.expandLv=0;setWidth(PW_N,false);paddle.laser=0;paddle.catchOn=0;paddle.mega=0;}
    else{slowF=Math.max(0.5,slowF-0.20);renorm();}
  }
  else if(t==='B')doorOpen=true;
  else if(t==='P')lives=Math.min(lives+1,9);
  else if(t==='D'){
    const src=balls[0],cap=(mode==='2002')?TUNE.disruptionBalls:3;
    if(src&&!src.stuck){
      const sp=Math.hypot(src.vx,src.vy)||ballSpeed(),a0=Math.atan2(src.vy,src.vx);
      let i=0;
      while(balls.length<cap){
        const a=a0+((i%2?1:-1)*(0.30+0.22*Math.floor(i/2)));
        balls.push({x:src.x,y:src.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:BR,stuck:false,off:0});
        i++;
        if(i>10)break;
      }
    }
  }
}

/* ===================== 破片 ===================== */
function burst(x,y,c,n){for(let i=0;i<(n||8);i++)
  bits.push({x:x,y:y,vx:(Math.random()-.5)*3.6*SC,vy:((Math.random()-.5)*3.6-1)*SC,life:20,c:c});}

/* ===================== ブロック ===================== */
function killBrick(k){
  k.alive=false;
  if(k.t==='S'||k.t==='V')addScore(50*round);
  else{addScore(BRICK[k.t].p);tryDropCap(k.x+BW/2,k.y+BH/2,k.item);}
  burst(k.x+BW/2,k.y+BH/2,BRICK[k.t].c,9);
  beep(560,.05,'square',.05);
}
function damage(k,mega){
  countHit();
  if(k.t==='G'){k.hit=6;beep(300,.04,'square',.04);return;}
  if(mega&&(k.t==='S'||k.t==='V'))k.hp=0;else k.hp--;
  k.hit=6;
  if(k.hp<=0)killBrick(k);else beep(380,.05,'square',.04);
}
function blastAt(x,y,rad){
  for(const k of bricks){
    if(!k.alive||k.t==='G')continue;
    const dx=k.x+BW/2-x,dy=k.y+BH/2-y;
    if(dx*dx+dy*dy<rad*rad){k.hp--;k.hit=6;if(k.hp<=0)killBrick(k);}
  }
  burst(x,y,'#fc9838',18);
}
function bricksLeft(){for(const k of bricks)if(k.alive&&k.t!=='G')return true;return false;}

/* ===================== 敵 ===================== */
const FOE_BY_ROUND=[
 {r:1,t:['slander']},{r:4,t:['slander','forgot']},{r:8,t:['slander','forgot','opopo']},
 {r:13,t:['forgot','opopo','cracker']},{r:18,t:['opopo','cracker','absorber']},
 {r:24,t:['cracker','absorber','repel']},{r:29,t:['forgot','absorber','repel']}
];
function foeR(){return mode==='2002'?6:13;}
function foeTypes(){
  if(mode!=='2002')return['slander'];
  let t=['slander'];
  for(const e of FOE_BY_ROUND) if(round>=e.r)t=e.t;
  return t;
}
function spawnFoe(){
  if(foes.length>=3)return;
  const types=foeTypes(),ty=types[(Math.random()*types.length)|0];
  const gx=Math.random()<.5?FX+FW*0.28:FX+FW*0.72;
  foes.push({ty:ty,x:gx,y:ROOF+4*SC+4,ph:Math.random()*6,t:0,hold:0,field:0,wait:0,life:0});
}
function killFoe(i,byPower){
  const f=foes[i];
  if(f.ty==='absorber'&&!byPower)return false;
  if(f.ty==='repel'&&f.field>0&&!byPower)return false;
  burst(f.x,f.y,'#c0a0ff',12);
  addScore(f.ty==='slander'?100:200);
  beep(240,.12,'sawtooth',.05);
  if(f.ty==='forgot')for(let j=0;j<3;j++)pets.push({x:f.x,y:f.y,vx:(j-1)*1.1*SC,vy:0.9*SC,t:0});
  else if(f.ty==='cracker'){blastAt(f.x,f.y,44*SC+8);shake=8;}
  if(f.hold){balls.push({x:f.x,y:f.y+14*SC,vx:0,vy:ballSpeed(),r:BR,stuck:false,off:0});absorbed--;}
  foes.splice(i,1);
  return true;
}
function foeToBrick(f){
  const c=Math.max(0,Math.min(COLS-1,Math.round((f.x-FX-BW/2)/BW)));
  const r=Math.max(0,Math.round((f.y-TOP)/BH));
  const y=TOP+r*BH;
  for(const k of bricks) if(k.alive&&k.x===FX+c*BW&&k.y===y)return;
  bricks.push({x:FX+c*BW,y:y,t:COLKEYS[(Math.random()*6)|0],alive:true,hit:6,hp:1,item:false});
}

/* ===================== パドル反射 ===================== */
function bounceOffPaddle(b){
  const u=Math.max(-1,Math.min(1,(b.x-(paddle.x+paddle.w/2))/(paddle.w/2)));
  const s=ballSpeed();
  let ang;
  if(mode==='2002'){
    const half=(TUNE.angleZones-1)/2;
    const q=Math.round(u*half)/half;              // 仕様書: 7段階へ量子化
    // 真の垂直は永久往復になるため、中央ゾーンは進行方向へわずかに傾ける
    ang=(q===0)?0.10*((b.vx<0)?-1:1):q*(TUNE.maxAngleDeg*Math.PI/180);
  }else{
    const a=Math.abs(u);
    ang=(a<=0.35?0.36:(a<=0.78?Math.PI/4:1.24))*(u<0?-1:1);
    if(a<0.05)ang=0.36*((b.vx<0)?-1:1);
  }
  b.x=Math.max(FX+b.r,Math.min(FR-b.r,b.x));b.y=PADY-b.r-0.5;
  b.vx=Math.sin(ang)*s;b.vy=-Math.abs(Math.cos(ang)*s);
  beep(440,.05,'square',.05);
}

/* ===================== ボス ===================== */
function dartSp(){return mode==='2002'?TUNE.enemyShotPxPerTick:1.9;}
function bossHit(){
  boss.hp--;boss.flash=8;addScore(1000);shake=8;beep(180,.15,'square',.06);
  if(boss.hp<=0){
    burst(boss.x||CX(),boss.y||ROOF+40,'#ffffff',60);shake=24;
    if(round===FINAL)finishGame();else clearRound(0);
  }
}
function updateBoss(){
  const b=boss;
  if(b.flash>0)b.flash--;
  if(b.kind==='doh86'||b.kind==='doh'){
    if(b.kind==='doh86'){
      if(--b.dart<=0){
        const a=Math.atan2(PADY-(b.y+b.h/2),paddle.x+paddle.w/2-b.x);
        darts.push({x:b.x,y:b.y+b.h/2,vx:Math.cos(a)*dartSp(),vy:Math.sin(a)*dartSp()});
        b.dart=200+((Math.random()*140)|0);beep(200,.1,'sawtooth',.04);
      }
    }else{
      if(--b.timer<=0){
        for(let i=0;i<4;i++)b.minions.push({x:b.x,y:b.y+b.h/2,
          tx:CX()+(i-1.5)*FW*0.16,ty:ROOF+FW*0.42,st:0,t:0});
        b.timer=440;beep(200,.1,'sawtooth',.04);
      }
      if(b.hp<=8)b.flip=true;
      if(b.flip&&--b.laser<=0){
        for(const s of [-1,1])darts.push({x:b.x+s*b.w*0.27,y:b.y+6,vx:s*1.5*SC,vy:1.6*SC});
        b.laser=240;beep(220,.12,'sawtooth',.04);
      }
      for(let i=b.minions.length-1;i>=0;i--){
        const m=b.minions[i];m.t++;
        if(m.st===0){m.x+=(m.tx-m.x)*0.06;m.y+=(m.ty-m.y)*0.06;if(m.t>90){m.st=1;m.t=0;}}
        else{if(m.t===30)darts.push({x:m.x,y:m.y+8*SC,vx:0,vy:2.1*SC});
          if(m.t>70)b.minions.splice(i,1);}
      }
    }
  }else if(b.kind==='crawler'){
    b.t++;
    const hx=CX()+Math.sin(b.t*0.021)*b.amp, hy=b.cy+Math.sin(b.t*0.013)*FW*0.09;
    b.trail.unshift({x:hx,y:hy});
    if(b.trail.length>90)b.trail.pop();
    if(--b.dart<=0){
      const h=b.trail[0],a=Math.atan2(PADY-h.y,paddle.x+paddle.w/2-h.x);
      darts.push({x:h.x,y:h.y,vx:Math.cos(a)*dartSp(),vy:Math.sin(a)*dartSp()});
      b.dart=150+((Math.random()*120)|0);beep(200,.1,'sawtooth',.04);
    }
  }else if(b.kind==='dohfinal'){
    b.t++;
    const alive=b.arms.filter(a=>a.hp>0);
    for(const a of b.arms){
      if(a.flash>0)a.flash--;
      if(a.hp<=0){a.y=Math.max(0,a.y-4*SC);continue;}
      if(a.st>0){a.st--;a.y=a.st>60?a.y+3.2*SC:Math.max(0,a.y-3.2*SC);}
    }
    if(alive.length&&--b.punch<=0){
      alive[(Math.random()*alive.length)|0].st=120;b.punch=220;beep(160,.12,'sawtooth',.05);
    }
    if(!alive.length){
      if(--b.laser<=0){
        const a=Math.atan2(PADY-(b.y+b.h/2),paddle.x+paddle.w/2-b.x);
        darts.push({x:b.x,y:b.y+b.h/2,vx:Math.cos(a)*2.0*SC,vy:Math.sin(a)*2.0*SC});
        b.laser=170;beep(210,.12,'sawtooth',.04);
      }
      if(--b.rev<=0){reverseT=280;b.rev=760;beep(120,.3,'sawtooth',.05);}
    }
  }
}
function ballVsBoss(b){
  const bo=boss;if(!bo)return false;
  if(bo.kind==='doh86'||bo.kind==='doh'){
    if(bo.hp>0&&b.x>bo.x-bo.w/2&&b.x<bo.x+bo.w/2&&b.y-b.r<bo.y+bo.h/2&&b.y+b.r>bo.y-bo.h/2){
      b.vy=Math.abs(b.vy);b.y=bo.y+bo.h/2+b.r;bossHit();burst(b.x,b.y,'#ffd2a0',10);return true;
    }
    if(bo.kind==='doh')for(let i=bo.minions.length-1;i>=0;i--){
      const m=bo.minions[i],dx=b.x-m.x,dy=b.y-m.y,rr=b.r+7*SC+4;
      if(dx*dx+dy*dy<rr*rr){
        bo.minions.splice(i,1);addScore(300);burst(m.x,m.y,'#ffa0a0',10);
        const a=Math.atan2(dy,dx),sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;return true;
      }
    }
  }else if(bo.kind==='crawler'){
    for(let i=0;i<bo.seg.length;i++){
      const s=bo.seg[i];if(!s.alive)continue;
      const p=bo.trail[Math.min(bo.trail.length-1,i*bo.lead)];if(!p)continue;
      const rr=b.r+(mode==='2002'?6:12),dx=b.x-p.x,dy=b.y-p.y;
      if(dx*dx+dy*dy<rr*rr){
        s.alive=false;addScore(1000);burst(p.x,p.y,'#ffe14d',14);shake=6;beep(180,.14,'square',.06);
        const a=Math.atan2(dy,dx),sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;
        if(!bo.seg.some(x=>x.alive))clearRound(0);
        return true;
      }
    }
  }else if(bo.kind==='dohfinal'){
    for(const a of bo.arms){
      if(a.hp<=0)continue;
      const ax=bo.x+a.side*bo.w*0.75,ay=bo.y+bo.h*0.25+a.y,hw=bo.w*0.25,hh=bo.h*0.34;
      if(b.x>ax-hw&&b.x<ax+hw&&b.y>ay-hh&&b.y<ay+hh){
        a.hp--;a.flash=8;addScore(500);burst(b.x,b.y,'#c0c0ff',10);
        b.vy=(b.y<ay)?-Math.abs(b.vy):Math.abs(b.vy);
        beep(200,.1,'square',.05);
        if(a.hp<=0){burst(ax,ay,'#ffffff',24);shake=10;}
        return true;
      }
    }
    if(!bo.arms.some(a=>a.hp>0)&&b.x>bo.x-bo.w/2&&b.x<bo.x+bo.w/2&&
       b.y-b.r<bo.y+bo.h/2&&b.y+b.r>bo.y-bo.h/2){
      b.vy=Math.abs(b.vy);b.y=bo.y+bo.h/2+b.r;bossHit();burst(b.x,b.y,'#ffd2a0',10);return true;
    }
  }
  return false;
}

/* ===================== 更新 ===================== */
function update(){
  if(shake>0)shake--;
  if(flash>0)flash--;
  if(fireCool>0)fireCool--;
  if(reverseT>0)reverseT--;
  if(fadeIn>0)fadeIn--;
  if(serveSpawn>0)serveSpawn--;
  if(doorOpen&&doorAnim<1)doorAnim=Math.min(1,doorAnim+0.06);
  if(!doorOpen&&doorAnim>0)doorAnim=Math.max(0,doorAnim-0.06);
  if(paddle.animT>0){                                   // Eの伸長アニメ（約0.5秒）
    paddle.animT--;
    const t=1-paddle.animT/TUNE.expandTicks,e=1-(1-t)*(1-t),c=paddle.x+paddle.w/2;
    paddle.w=paddle.wFrom+(paddle.wTarget-paddle.wFrom)*e;
    paddle.x=c-paddle.w/2;
  }

  const kv=(mode==='2002')?(keys['Shift']?(keys['Alt']?TUNE.paddleSpeed[2]:TUNE.paddleSpeed[1]):TUNE.paddleSpeed[0]):7;
  if(keys['ArrowLeft'])paddle.target-=kv*(reverseT>0?-1:1);
  if(keys['ArrowRight'])paddle.target+=kv*(reverseT>0?-1:1);

  const rl=doorOpen?FR+paddle.w:FR-paddle.w/2;
  const px=Math.max(FX+paddle.w/2,Math.min(rl,paddle.target));
  paddle.x+=(px-paddle.w/2-paddle.x)*(drag?0.85:0.45);

  for(const b of balls) if(b.stuck){b.x=paddle.x+paddle.w/2+b.off;b.y=PADY-b.r-1;}

  if(state==='clear'){updateBits();
    if(--clearT<=0){if(round>=FINAL)finishGame();else{round++;startRound();}}return;}
  if(state==='ready'){updateBits();if(--readyT<=0){if(mode==='2002'){state='serve';serveSpawn=22;}else launch();}return;}
  if(state==='continue'){updateBits();if(--contT<=0){state='over';msg='GAME OVER';}return;}
  if(state!=='play'){updateBits();return;}

  stallT++;recalcStep();
  if(doorOpen&&paddle.x>FR-6){clearRound(10000);return;}
  if(boss)updateBoss();

  if(!boss&&--foeTimer<=0){spawnFoe();foeTimer=420+((Math.random()*300)|0);}
  for(let i=foes.length-1;i>=0;i--){
    const f=foes[i];f.t++;f.life++;
    if(f.hold){f.hold--;
      if(f.hold<=0){balls.push({x:f.x,y:f.y+14*SC,vx:0,vy:ballSpeed(),r:BR,stuck:false,off:0});absorbed--;}
      continue;}
    if(f.ty==='cracker'){f.wait=(f.wait+1)%120;if(f.wait<70){f.y+=0.7*SC;f.x+=Math.sin(f.t*0.05)*0.6*SC;}}
    else if(f.ty==='repel'){f.y+=0.5*SC;f.x+=Math.sin(f.t*0.03+f.ph)*1.0*SC;
      if(f.field>0)f.field--;else if(f.t%210===0)f.field=100;}
    else{f.y+=0.62*SC;f.x+=Math.sin(f.t*0.035+f.ph)*1.0*SC;}
    f.x=Math.max(FX+foeR(),Math.min(FR-foeR(),f.x));
    if(f.ty==='opopo'&&f.life>420){foeToBrick(f);foes.splice(i,1);continue;}
    if(f.y>H+20){foes.splice(i,1);continue;}
    if(f.y+foeR()>PADY&&f.y-foeR()<PADY+PADH&&f.x>paddle.x-8&&f.x<paddle.x+paddle.w+8){
      if(killFoe(i,true))flash=4;
    }
  }
  for(let i=pets.length-1;i>=0;i--){
    const p=pets[i];p.t++;p.x+=p.vx;p.y+=p.vy;
    p.x=Math.max(FX+3,Math.min(FR-3,p.x));
    for(const k of bricks){
      if(!k.alive||k.t==='G')continue;
      if(p.x>k.x&&p.x<k.x+BW&&p.y>k.y&&p.y<k.y+BH){k.hp--;k.hit=6;if(k.hp<=0)killBrick(k);p.vy*=-1;break;}
    }
    if(p.t>360||p.y>H)pets.splice(i,1);
  }
  for(let i=darts.length-1;i>=0;i--){
    const d=darts[i];d.x+=d.vx;d.y+=d.vy;
    if(d.y>H||d.x<0||d.x>FR){darts.splice(i,1);continue;}
    if(d.y>PADY-3&&d.y<PADY+PADH&&d.x>paddle.x&&d.x<paddle.x+paddle.w){darts.splice(i,1);loseLife();return;}
  }
  for(const b of balls) if(b.stuck){if(++paddle.holdT>(mode==='2002'?TUNE.catchReleaseTicks:190))releaseBall(b);}

  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.stuck)continue;
    const steps=Math.max(1,Math.min(4,Math.ceil(Math.hypot(b.vx,b.vy)/(mode==='2002'?1.5:3))));
    let out=false;
    for(let s=0;s<steps&&!out;s++){
      b.x+=b.vx/steps;b.y+=b.vy/steps;
      if(b.x-b.r<FX){b.x=FX+b.r;b.vx=Math.abs(b.vx);beep(300,.03,'square',.03);}
      if(b.x+b.r>FR){b.x=FR-b.r;b.vx=-Math.abs(b.vx);beep(300,.03,'square',.03);}
      if(b.y-b.r<ROOF){b.y=ROOF+b.r;b.vy=Math.abs(b.vy);beep(300,.03,'square',.03);
        if(!ceilHit){ceilHit=true;recalcStep();renorm();}}

      if(b.vy>0&&b.y+b.r>=PADY&&b.y-b.r<=PADY+PADH&&b.x>=paddle.x-3&&b.x<=paddle.x+paddle.w+3){
        stallT=0;
        if(paddle.catchOn){b.stuck=true;
          b.off=Math.max(-paddle.w/2+4,Math.min(paddle.w/2-4,b.x-(paddle.x+paddle.w/2)));
          b.vx=0;b.vy=0;paddle.holdT=0;beep(500,.05,'square',.05);}
        else bounceOffPaddle(b);
        break;
      }
      // Tのフォースフィールド（1回だけ跳ね返す）
      if(shield&&b.vy>0&&b.y+b.r>=PADY+PADH+10){
        b.y=PADY+PADH+10-b.r;b.vy=-Math.abs(b.vy);shield=0;flash=6;
        beep(700,.15,'sine',.06);break;
      }

      let bumped=false;
      for(let fi=foes.length-1;fi>=0;fi--){
        const f=foes[fi];if(f.hold)continue;
        const dx=b.x-f.x,dy=b.y-f.y,rr=(f.ty==='repel'&&f.field>0)?(foeR()*2):foeR();
        if(dx*dx+dy*dy<(b.r+rr)*(b.r+rr)){
          if(f.ty==='repel'&&f.field>0){
            const a=Math.atan2(b.vy,b.vx)+0.26,sp=Math.hypot(b.vx,b.vy);
            b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;bumped=true;break;
          }
          if(f.ty==='absorber'&&!paddle.mega){
            f.hold=90;absorbed++;
            f.x=FX+foeR()+Math.random()*(FW-foeR()*2);f.y=ROOF+20*SC+20+Math.random()*60*SC;
            balls.splice(i,1);bumped=true;out=true;beep(300,.2,'sine',.05);break;
          }
          const a=Math.atan2(dy,dx),sp=Math.hypot(b.vx,b.vy);
          b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;
          killFoe(fi,paddle.mega?true:false);bumped=true;break;
        }
      }
      if(bumped)break;
      if(ballVsBoss(b))break;

      let hit=false;
      for(const k of bricks){
        if(!k.alive)continue;
        if(b.x+b.r>k.x&&b.x-b.r<k.x+BW&&b.y+b.r>k.y&&b.y-b.r<k.y+BH){
          if(paddle.mega&&k.t!=='G'){damage(k,true);continue;}   // Mは金以外を貫通
          const ox=Math.min(b.x+b.r-k.x,k.x+BW-(b.x-b.r));
          const oy=Math.min(b.y+b.r-k.y,k.y+BH-(b.y-b.r));
          if(ox<oy){b.vx=-b.vx;b.x+=b.vx>0?ox:-ox;}else{b.vy=-b.vy;b.y+=b.vy>0?oy:-oy;}
          damage(k,false);hit=true;break;
        }
      }
      if(hit)break;
      if(b.y-b.r>H){balls.splice(i,1);out=true;}
    }
  }
  if(balls.length===0&&absorbed===0){loseLife();return;}

  for(let i=caps.length-1;i>=0;i--){
    const c=caps[i];c.y+=(mode==='2002'?TUNE.capsuleFallPxPerTick:1.6);c.ph+=0.22;
    const cw=(mode==='2002'?16:30);
    if(c.y>PADY-6&&c.y<PADY+PADH+6&&c.x>paddle.x-cw/2&&c.x<paddle.x+paddle.w+cw/2){
      applyCap(c.t);caps.splice(i,1);flash=6;continue;}
    if(c.y>H)caps.splice(i,1);
  }

  if(shots.length){
    const hitLinks={},sp=(mode==='2002')?TUNE.laserSpeedPxPerSec/60:9;
    for(const s of shots){
      s.y-=sp;
      if(s.y<ROOF){s.dead=true;continue;}
      let gone=false;
      for(let fi=foes.length-1;fi>=0;fi--){
        const f=foes[fi];
        if(!f.hold&&Math.abs(s.x-f.x)<foeR()+2&&Math.abs(s.y-f.y)<foeR()+2){killFoe(fi,true);gone=true;break;}
      }
      if(!gone&&boss&&(boss.kind==='doh86'||boss.kind==='doh')&&boss.hp>0&&
         s.x>boss.x-boss.w/2&&s.x<boss.x+boss.w/2&&s.y<boss.y+boss.h/2&&s.y>boss.y-boss.h/2){
        bossHit();gone=true;
      }
      if(!gone)for(const k of bricks){
        if(!k.alive)continue;
        if(s.x>k.x&&s.x<k.x+BW&&s.y<k.y+BH&&s.y>k.y){
          if(k.t==='G')gone=true; else damage(k,false),gone=true;
          break;
        }
      }
      if(gone){s.dead=true;hitLinks[s.link]=1;}
    }
    shots=shots.filter(s=>!s.dead&&!hitLinks[s.link]);
  }

  updateBits();
  if(!boss&&!bricksLeft())clearRound(0);
}
function updateBits(){
  for(let i=bits.length-1;i>=0;i--){const p=bits[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.18*SC;p.life--;
    if(p.life<=0)bits.splice(i,1);}
  for(const k of bricks)if(k.hit>0)k.hit--;
}

function pcText(text,x,y,scale,color,align){
  text=String(text).toUpperCase();scale=scale||1;color=color||'#fff';align=align||'left';
  const cw=6*scale,total=Math.max(0,text.length*cw-scale);
  let sx=x;if(align==='center')sx=x-total/2;else if(align==='right')sx=x-total;
  ctx.fillStyle=color;
  for(let i=0;i<text.length;i++){
    const g=PCFONT[text[i]]||PCFONT['?'];
    for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(g[r][c]==='1')ctx.fillRect(Math.round(sx+i*cw+c*scale),Math.round(y+r*scale),scale,scale);
  }
}
function drawBrick(k){

  ctx.fillStyle=k.hit>0?shade(c,60):c;ctx.fillRect(k.x,k.y,BW-(small?1:2),BH-(small?1:2));

function drawVaus(x,y,w,h,small){
  if(small){
    // 2002 PC: rounded red end-caps + silver cylindrical center.
    x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
    const cap=Math.min(6,Math.max(4,Math.round(w*0.16))), mid=Math.max(1,w-cap*2);
    ctx.fillStyle='#09090d';ctx.fillRect(x-1,y,w+2,h);ctx.fillRect(x,y-1,w,h+2);
    // center tube
    ctx.fillStyle='#5d6270';ctx.fillRect(x+cap,y,mid,h);
    ctx.fillStyle='#f4f6ff';ctx.fillRect(x+cap,y+1,mid,h-3);
    ctx.fillStyle='#c0c5d2';ctx.fillRect(x+cap,y+3,mid,Math.max(1,h-4));
    ctx.fillStyle='#ffffff';ctx.fillRect(x+cap+1,y+1,Math.max(1,mid-2),1);
    ctx.fillStyle='#777d8b';ctx.fillRect(x+cap,y+h-2,mid,1);
    // rounded caps, 1px clipped corners
    for(const sx of [x,x+w-cap]){
      ctx.fillStyle='#74101c';ctx.fillRect(sx+1,y,cap-2,h);ctx.fillRect(sx,y+1,cap,h-2);
      ctx.fillStyle='#d52c3b';ctx.fillRect(sx+1,y+1,cap-2,h-2);
      ctx.fillStyle='#ff6670';ctx.fillRect(sx+2,y+1,Math.max(1,cap-3),1);
      ctx.fillStyle='#8d1722';ctx.fillRect(sx+1,y+h-2,Math.max(1,cap-2),1);
    }
    return;
  }
  ctx.fillStyle='#101010';ctx.fillRect(x-1,y-1,w+2,h+2);
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#bcbcbc');g.addColorStop(1,'#606060');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  const band=Math.max(3,Math.round(w*0.12));

  ctx.fillStyle='#e8e8e8';ctx.fillRect(x+band,y+1,w-band*2,h-3);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x+band,y+1,w-band*2,1);
}

function drawFoe(f){

    ctx.fillStyle='#3e78da';ctx.fillRect(-R*.72,-R*.72,R*1.44,R*1.44);

  }else if(f.ty==='forgot'){
    ctx.fillStyle='#50a0e0';

    ctx.ellipse(0,0,R*1.25,R*0.4,Math.sin(t*0.4)*0.5,0,7);ctx.stroke();
  }else if(f.ty==='absorber'){
    ctx.fillStyle='rgba(180,220,255,.6)';ctx.beginPath();ctx.arc(0,-R*0.15,R*0.92,Math.PI,0);ctx.fill();

  }else if(f.ty==='repel'){

      ctx.lineWidth=mode==='2002'?1:2;ctx.beginPath();ctx.arc(0,0,R*1.9,0,7);ctx.stroke();}

  }

}

      const r=(mode==='2002')?6:12;

      ctx.fillStyle='#ffd0a0';ctx.beginPath();ctx.arc(m.x,m.y,r*0.42,0,7);ctx.fill();
    }

      ctx.fillStyle=i===0?'#ffe14d':'#e0b020';

  }else if(b.kind==='dohfinal'){

      if(a.hp<=0)continue;
      const ax=x+a.side*w*0.75,ay=y+h*0.25+a.y;
      ctx.fillStyle=a.flash>0?'#ffffff':'#6a7a5a';
      ctx.fillRect(ax-w*0.16,y-h*0.1,w*0.32,ay-y+h*0.2);
      ctx.fillStyle=a.flash>0?'#ffffff':'#8a9a72';
      ctx.fillRect(ax-w*0.25,ay-h*0.3,w*0.5,h*0.6);
      ctx.fillStyle='#d82800';
      for(let i=0;i<a.hp;i++)ctx.fillRect(ax-w*0.2+i*(mode==='2002'?3:6),ay+h*0.34,2,3);
    }
    ctx.fillStyle=b.flash>0?'#ffffff':'#5e6a50';ctx.fillRect(x-w*0.62,y+h*0.5,w*1.24,h*0.6);
    drawDohFace(x,y,w,h,b.flash,false,b.hp);
  }
}
function drawPCBackground(){
  if(mode!=='2002')return;
  // Static, procedural stand-ins for the 2002 PC backgrounds. ROUND 1 is tuned against
  // the uploaded footage: deep-blue star field with the large cruiser in the lower half.
  const themes=['#081084','#078018','#72080c','#292934','#292934','#6b080d','#168b16','#081080','#25252c','#2b2b32'];
  const base=themes[(round-1)%themes.length];
  ctx.fillStyle=base;ctx.fillRect(FX,ROOF,FW,H-ROOF);
  // subtle tile/pixel texture, deterministic (no per-frame flicker)
  ctx.globalAlpha=.22;
  ctx.fillStyle='#60a0ff';
  for(let yy=ROOF;yy<PADY;yy+=8)for(let xx=FX;xx<FR;xx+=8){
    const n=((xx*13+yy*7+round*19)>>3)&3;
    if(n===0)ctx.fillRect(xx,yy,4,1);else if(n===1)ctx.fillRect(xx+4,yy+3,1,4);
  }
  ctx.globalAlpha=1;
  if(round===1){
    // denser blue nebula / star texture
    ctx.globalAlpha=.18;ctx.fillStyle='#b8d2ff';
    for(let yy=ROOF+4;yy<PADY-4;yy+=7)for(let xx=FX+3;xx<FR-2;xx+=9){
      const n=((xx*17+yy*11)>>2)&7;if(n<2)ctx.fillRect(xx+(n?3:0),yy+(n?1:4),n?1:3,1);
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#d8e8ff';
    const stars=[[18,19],[43,31],[79,18],[119,35],[149,17],[28,65],[72,86],[139,78],[18,130],[105,119],[150,145],[54,151],[132,111],[88,142]];
    for(const q of stars)ctx.fillRect(FX+q[0],ROOF+q[1],1,1);
    // larger cruiser, tuned to occupy the lower-middle like the PC footage
    ctx.save();ctx.translate(FX+5,ROOF+91);
    ctx.fillStyle='#16266d';
    ctx.beginPath();ctx.moveTo(0,56);ctx.lineTo(33,25);ctx.lineTo(91,8);ctx.lineTo(139,20);ctx.lineTo(155,35);ctx.lineTo(145,55);ctx.lineTo(99,66);ctx.lineTo(35,68);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2e45b0';ctx.fillRect(29,30,108,26);ctx.fillRect(18,43,123,17);
    ctx.fillStyle='#465fd0';ctx.fillRect(48,19,73,11);ctx.fillRect(53,32,73,5);ctx.fillRect(39,47,84,4);
    ctx.fillStyle='#6f82ec';ctx.fillRect(57,18,44,3);ctx.fillRect(63,27,57,2);ctx.fillRect(51,37,65,2);
    ctx.fillStyle='#17286f';
    for(const q of [[69,34],[83,33],[97,32],[111,31]])ctx.fillRect(q[0],q[1],8,5);
    ctx.fillStyle='#9badff';
    for(const q of [[70,34],[84,33],[98,32],[112,31]])ctx.fillRect(q[0],q[1],3,2);
    // nose and guns
    ctx.fillStyle='#2a40aa';ctx.fillRect(3,50,40,7);ctx.fillRect(6,61,35,6);ctx.fillRect(0,52,20,3);ctx.fillRect(4,63,19,3);
    ctx.fillStyle='#9fb0ff';ctx.fillRect(0,52,19,1);ctx.fillRect(4,63,18,1);
    // top turrets
    ctx.fillStyle='#263a9a';ctx.fillRect(76,14,22,6);ctx.fillRect(86,10,8,5);ctx.fillRect(111,23,17,6);
    ctx.fillStyle='#8295ff';ctx.fillRect(78,14,17,1);ctx.fillRect(88,10,4,1);ctx.fillRect(113,23,12,1);
    // rear engines / fins
    ctx.fillStyle='#263a9e';ctx.fillRect(126,27,34,8);ctx.fillRect(124,42,36,8);ctx.fillRect(119,56,35,7);
    ctx.fillStyle='#8fa2ff';ctx.fillRect(151,28,9,2);ctx.fillRect(151,43,9,2);ctx.fillRect(145,57,9,2);
    // underside shadow accents
    ctx.fillStyle='#0f1d59';ctx.fillRect(43,57,67,4);ctx.fillRect(58,62,48,3);
    ctx.restore();
  }else if(round===2||round===7){
    ctx.globalAlpha=.22;ctx.fillStyle='#b0ffb0';
    for(let y=ROOF+2;y<PADY;y+=6)for(let x=FX+2;x<FR;x+=6){if(((x+y)>>2)&1)ctx.fillRect(x,y,3,1);}
    ctx.globalAlpha=1;
  }
}
function drawWalls(){
  const sm=(mode==='2002');
  if(sm){
    // Metallic frame seen in the PC footage: silver rails with dark inner edge and joints.
    ctx.fillStyle='#101018';ctx.fillRect(0,0,FR+16,ROOF);ctx.fillRect(0,ROOF,FX,H-ROOF);ctx.fillRect(FR,ROOF,16,H-ROOF);
    ctx.fillStyle='#6f727c';ctx.fillRect(1,0,FR+14,3);ctx.fillRect(1,ROOF,3,H-ROOF);ctx.fillRect(FR+12,ROOF,3,H-ROOF);
    ctx.fillStyle='#d8d8d8';ctx.fillRect(4,3,FR+8,3);ctx.fillRect(4,ROOF,3,H-ROOF);ctx.fillRect(FR+9,ROOF,3,H-ROOF);
    ctx.fillStyle='#ffffff';ctx.fillRect(7,5,FR+2,1);ctx.fillRect(7,ROOF,1,H-ROOF);ctx.fillRect(FR+8,ROOF,1,H-ROOF);
    ctx.fillStyle='#34343c';ctx.fillRect(13,ROOF,3,H-ROOF);ctx.fillRect(FR,ROOF,3,H-ROOF);ctx.fillRect(FX,13,FW,3);
    // top launch gates / seams
    ctx.fillStyle='#24242c';
    const gx1=Math.round(FX+FW*.19),gx2=Math.round(FX+FW*.69);
    for(const gx of [gx1,gx2]){ctx.fillRect(gx,1,28,4);ctx.fillStyle='#a8a8ac';ctx.fillRect(gx+2,1,24,1);ctx.fillStyle='#24242c';}
    // side joints
    for(const yy of [92,168]){ctx.fillStyle='#202028';ctx.fillRect(1,yy,14,5);ctx.fillRect(FR+1,yy,14,5);ctx.fillStyle='#b8b8bc';ctx.fillRect(2,yy+1,12,1);ctx.fillRect(FR+2,yy+1,12,1);}
    if(doorAnim>0){
      const dh=26*doorAnim;ctx.fillStyle='#000';ctx.fillRect(FR,PADY-12,16,dh);
      ctx.fillStyle='#80cfff';ctx.fillRect(FR,PADY-12,1,dh);ctx.fillRect(FR,PADY-12,16,1);
    }
    return;
  }
  ctx.fillStyle='#3a3a58';
  ctx.fillRect(0,HUD_TOP(),W,ROOF);ctx.fillRect(0,ROOF,FX,H-ROOF);ctx.fillRect(FR,ROOF,WALL,H-ROOF);
  ctx.fillStyle='#5a5a88';
  const step=16,bw=14;
  for(let x=0;x<W;x+=step)ctx.fillRect(x+0.5,HUD_TOP()+0.5,bw,ROOF-2);
  for(let y=ROOF;y<H;y+=step){ctx.fillRect(0.5,y+0.5,FX-1,bw);ctx.fillRect(FR+0.5,y+0.5,15,bw);}
  ctx.fillStyle='#14142a';const gw=28;
  ctx.fillRect(FX+FW*0.28-gw/2,HUD_TOP()+2,gw,ROOF-4);ctx.fillRect(FX+FW*0.72-gw/2,HUD_TOP()+2,gw,ROOF-4);
  if(doorAnim>0){const dh=60*doorAnim;ctx.fillStyle='#000';ctx.fillRect(FR,PADY-30,WALL,dh);ctx.fillStyle='#3cbcfc';ctx.fillRect(FR,PADY-30,1,dh);}
}
function HUD_TOP(){return mode==='2002'?0:56;}
function drawHUD(){
  if(mode==='2002'){
    ctx.fillStyle='#000';ctx.fillRect(FR+16,0,W-FR-16,H);
    const hx=FR+20;
    pcText('HIGH',hx,8,1,'#43ff54');
    pcText('SCORE',hx,16,1,'#43ff54');
    pcText(String(Math.max(50000,hi[mode],score)).padStart(5,'0'),hx+4,27,1,'#ffffff');
    pcText('1UP',hx,48,1,'#ff4557');
    pcText(String(score).padStart(2,'0'),hx+25,48,1,'#ffffff');
    drawVaus(hx+1,72,16,5,true);
    pcText(String(Math.max(0,lives-1)).padStart(2,'0'),hx+26,71,1,'#ffffff');
    pcText('ROUND',hx,176,1,'#43ff54');
    pcText(String(round),hx+27,188,1,'#ffffff');
  }else{
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,56);
    ctx.textBaseline='top';ctx.textAlign='left';
    ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#d82800';
    ctx.fillText('1UP',10,6);ctx.fillText('HIGH SCORE',134,6);
    ctx.textAlign='right';ctx.fillStyle='#8890b0';ctx.fillText('ROUND '+round+'/'+FINAL,W-10,6);
    ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle='#fcfcfc';
    ctx.textAlign='left';ctx.fillText(String(score).padStart(6,'0'),10,19);
    ctx.fillStyle='#fc9838';ctx.fillText(String(Math.max(hi[mode],score)).padStart(6,'0'),134,19);
    for(let i=0;i<Math.min(lives-1,6);i++)drawVaus(10+i*26,40,22,8,true);
    ctx.textAlign='right';ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#80d010';
    ctx.fillText('1986 ARCADE',W-10,41);
  }
}
function drawCenter(lines,cy,cx){
  ctx.textAlign='center';ctx.textBaseline='middle';
  const k=(mode==='2002'&&state!=='title')?0.62:1;
  let y=(cy||H/2)-((lines.length-1)*15*k);
  for(const L of lines){
    const sz=Math.max(7,Math.round((L.size||18)*k));
    ctx.font='bold '+sz+'px "Courier New",monospace';
    ctx.fillStyle=L.color||'#fcfcfc';ctx.fillText(L.t,cx||W/2,y);y+=sz+11*k;
  }
}
function drawTitle(){
  drawCenter([{t:'V A U S',size:38,color:'#fc9838'}],150);
  const box=(y,sel,title,sub,col)=>{
    ctx.fillStyle=sel?'rgba(60,188,252,.16)':'rgba(255,255,255,.04)';
    ctx.fillRect(40,y,W-80,78);
    ctx.strokeStyle=sel?'#3cbcfc':'#444';ctx.lineWidth=2;ctx.strokeRect(41,y+1,W-82,76);
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.font='bold 19px "Courier New",monospace';ctx.fillStyle=col;ctx.fillText(title,W/2,y+14);
    ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#8890b0';
    ctx.fillText(sub[0],W/2,y+40);ctx.fillText(sub[1],W/2,y+55);
  };
  box(228,titleSel===0,'1986 ARCADE',['アーケード版の再現','縦画面 / 11列 / 全33面'],'#80d010');
  box(328,titleSel===1,'2002 PC',['Doh It Again ベース','横画面 256x224 / 10列'],'#3cbcfc');
  drawCenter([{t:'遊びたい方をタップ',size:13,color:'#8890b0'}],450);
}
function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*.6*SC,(Math.random()-.5)*shake*.6*SC);
  ctx.fillStyle='#000';ctx.fillRect(-30,-30,W+60,H+60);
  if(state==='title'){drawTitle();ctx.restore();return;}

  drawPCBackground();
  drawWalls();
  for(const k of bricks)if(k.alive)drawBrick(k);
  if(boss)drawBoss();
  for(const f of foes)if(!f.hold)drawFoe(f);
  for(const p of pets){ctx.fillStyle='#a0d0ff';ctx.beginPath();ctx.arc(p.x,p.y,BR*1.3,0,7);ctx.fill();}
  for(const p of bits){ctx.globalAlpha=Math.max(0,p.life/20);ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,mode==='2002'?1:3,mode==='2002'?1:3);}
  ctx.globalAlpha=1;

  const lw=(mode==='2002')?3:3,lh=(mode==='2002')?10:12;
  for(const s of shots){ctx.fillStyle='#fc9838';ctx.fillRect(s.x-lw/2,s.y-lh,lw,lh);}
  for(const d of darts){ctx.fillStyle='#d82800';ctx.beginPath();ctx.arc(d.x,d.y,mode==='2002'?2:4,0,7);ctx.fill();}

  for(const c of caps){
    const w=(mode==='2002')?16:30,h=(mode==='2002')?8:14;
    if(mode==='2002'){
      const x=Math.round(c.x-w/2),y=Math.round(c.y-h/2),col=CAP[c.t].c,sh=Math.round(Math.sin(c.ph)*2);
      ctx.fillStyle='#09090d';ctx.fillRect(x-1,y+1,w+2,h-2);ctx.fillRect(x,y,w,h);
      ctx.fillStyle=shade(col,-55);ctx.fillRect(x,y+1,w,h-2);
      ctx.fillStyle=col;ctx.fillRect(x+1,y+1,w-2,h-2);
      ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillRect(x+2+Math.max(0,sh),y+1,Math.max(2,6-Math.abs(sh)),1);
      ctx.fillStyle=(c.t==='R')?'#fff':'#070707';pcText(c.t,c.x,y+1,1,ctx.fillStyle,'center');
    }else{
      ctx.fillStyle='#000';ctx.fillRect(c.x-w/2-1,c.y-h/2-1,w+2,h+2);ctx.fillStyle=CAP[c.t].c;ctx.fillRect(c.x-w/2,c.y-h/2,w,h);
      ctx.fillStyle='rgba(255,255,255,'+(0.3+0.35*Math.sin(c.ph))+')';ctx.fillRect(c.x-w/2,c.y-h/2,w,2);
      ctx.fillStyle=(c.t==='R')?'#fff':'#000';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.t,c.x,c.y+1);
    }
  }

  const hidePCServe=(mode==='2002'&&state==='ready');
  if(state!=='over'&&state!=='win'&&!hidePCServe){
    if(state==='ready'&&mode!=='2002'){ctx.fillStyle='rgba(60,188,252,.08)';ctx.fillRect(FX,PADY-70,FW,H-(PADY-70));}
    drawPaddle();
    if(mode==='2002'&&state==='serve'&&serveSpawn>0){ctx.fillStyle='rgba(255,255,255,'+(serveSpawn/28)+')';
      const cx=paddle.x+paddle.w/2;ctx.fillRect(cx-22,PADY-3,44,1);ctx.fillRect(cx-14,PADY-7,28,1);}
  }
  for(const b of balls){if(hidePCServe)continue;
    if(paddle.mega){ctx.fillStyle='rgba(120,255,160,.4)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,7);ctx.fill();
      ctx.fillStyle='#b0ffc0';}
    else{if(mode!=='2002'){ctx.fillStyle='rgba(216,40,0,.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,7);ctx.fill();}
      ctx.fillStyle='#fcfcfc';}
    if(mode==='2002'){const bx=Math.round(b.x),by=Math.round(b.y);ctx.fillStyle='#273a88';ctx.fillRect(bx-2,by-1,5,3);ctx.fillRect(bx-1,by-2,3,5);ctx.fillStyle='#b8d4ff';ctx.fillRect(bx-1,by-1,3,3);ctx.fillStyle='#ffffff';ctx.fillRect(bx,by-1,1,1);}
    else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}
  }

  drawHUD();
  if(reverseT>0){ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold '+(mode==='2002'?9:15)+'px "Courier New",monospace';ctx.fillStyle='#ff6060';
    ctx.fillText('REVERSE!',CX(),PADY-(mode==='2002'?22:40));}
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash/40)+')';ctx.fillRect(0,0,W,H);}

  const cx=CX();
  if(state==='over'){
    drawCenter([{t:'GAME OVER',size:30,color:'#d82800'},{t:'SCORE '+score,size:17},
      {t:'BEST  '+hi[mode],size:14,color:'#fc9838'},{t:'',size:4},
      {t:'タップでタイトルへ',size:13,color:'#8890b0'}],H/2,cx);
  }else if(state==='continue'){
    drawCenter([{t:'CONTINUE?',size:28,color:'#fc9838'},
      {t:String(Math.ceil(contT/60)),size:26},{t:'',size:4},
      {t:'タップで同じラウンドから再開',size:12,color:'#8890b0'}],H/2,cx);
  }else if(state==='win'){
    drawCenter([{t:'CONGRATULATIONS',size:21,color:'#fc9838'},
      {t:mode==='2002'?'WORLD 1 COMPLETE':'DOH HAS FALLEN',size:13,color:'#3cbcfc'},
      {t:'',size:4},{t:'SCORE '+score,size:17},{t:'タップでタイトルへ',size:13,color:'#8890b0'}],H/2,cx);
  }else if(mode==='2002'&&state==='ready'){
    pcText('PLAYER 1',CX(),141,1,'#f8f8ff','center');pcText('READY',CX(),154,1,'#f8f8ff','center');
  }else if(msg&&(state==='ready'||state==='clear')){
    drawCenter([{t:msg,size:20,color:state==='clear'?'#fc9838':'#fcfcfc'}],H/2,cx);
  }
  if(mode==='2002'&&state==='clear'){const a=Math.max(0,Math.min(1,(TUNE.roundClearTicks-clearT)/48));ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,W,H);}
  if(mode==='2002'&&fadeIn>0){ctx.fillStyle='rgba(0,0,0,'+(fadeIn/24)+')';ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

/* ===================== ループ ===================== */
let last=0,acc=0;const STEP=1000/60;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  let dt=t-last;last=t;
  if(dt>200)dt=STEP;
  acc+=dt;let g=0;
  while(acc>=STEP&&g<5){update();acc-=STEP;g++;}
  if(g>=5)acc=0;
  render();
}
document.addEventListener('visibilitychange',()=>{last=0;acc=0;});
if(new URLSearchParams(location.search).get('pc2002')==='1'){mode='2002';setLayout('2002');startGame();}
else setLayout('1986');
requestAnimationFrame(loop);

})();
</script>
